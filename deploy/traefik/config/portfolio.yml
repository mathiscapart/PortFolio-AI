# Provider file : l'API tourne en process Windows NATIF (wheels ROCm win_amd64)
# sur le PC du GPU, alors que Traefik tourne sur le serveur front (Debian, toujours
# allume). Invisible au provider Docker, le service est declare a la main.
#
# Le ROUTEUR, lui, est en label Docker sur le service traefik : compose y
# interpole ${TRAEFIK_DOMAIN}. Aucun templating Go ici -- le provider file ne
# rend pas forcement les .yml, et une regle contenant des accolades litterales
# ne matcherait jamais, sans le moindre message d'erreur.
http:
  services:
    portfolio-api:
      loadBalancer:
        servers:
          # IP fixe du PC du GPU sur le reseau local.
          - url: "http://192.168.1.75:8000"
        passHostHeader: true
        serversTransport: pc-gpu

  serversTransports:
    # Le PC du GPU est souvent eteint : sans delai court, Traefik attendrait
    # 30 s avant de repondre 502, et le front annoncerait l'IA hors ligne en
    # retard (il abandonne /health au bout de 5 s).
    pc-gpu:
      forwardingTimeouts:
        dialTimeout: 2s

  middlewares:
    strip-api:
      stripPrefix:
        prefixes: ["/api"]

    # L'API est non authentifiee et adossee a une seule GPU : sans limite,
    # quiconque la decouvre ouvre des sessions /voice en boucle.
    rate-limit:
      rateLimit:
        average: 30
        period: 1m
        burst: 10
        # Derriere cloudflared, Traefik ne voit que l'IP du tunnel : sans ce
        # critere le compteur serait GLOBAL, et le premier visiteur bloquerait
        # tous les autres. Cf-Connecting-Ip porte l'IP reelle du visiteur.
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip

    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        forceSTSHeader: true
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        # Verifiee dans Chromium (parcours vocal complet + page parcours, zero
        # violation). 'unsafe-inline' sur script-src : l'export statique Next
        # injecte des scripts inline dont le hash change a chaque build. blob: :
        # le worklet de capture micro est charge depuis une URL blob.
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://mathiscapart.xyz; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
        permissionsPolicy: "microphone=(self), camera=(), geolocation=()"
