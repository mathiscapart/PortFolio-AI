services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.15.5}
    container_name: qdrant
    restart: unless-stopped
    ports:
      # Boucle locale seulement : Qdrant n a pas de cle API, publie sur toutes
      # les interfaces n importe quel appareil du reseau pourrait vider l index.
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - portfolio-ai
  rag:
    build:
      context: ./backend/rag
      args:
        - PYTHON_VERSION=${PYTHON_VERSION:-3.12}
    container_name: portfolio-rag
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-portfolio}
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - portfolio-ai

volumes:
  qdrant_data:

networks:
  portfolio-ai:
    driver: bridge
